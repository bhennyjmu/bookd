<style>
:root{
  --ground:#1d1222; --card:#2a1a31; --well:#160d1b;
  --cream:#f7f2e7; --inkcream:#2a132b;
  --text:#f6f1e8; --t2:rgba(246,241,232,.55); --t3:rgba(246,241,232,.45); --t4:rgba(246,241,232,.32);
  --pink:#ef6f92; --pinkdeep:#d4527a; --gold:#e6c377; --inkgold:#3a2410;
  --green:#2f9e63; --greenv:#1f7a4a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%; color-scheme:dark}
body{background:var(--ground); color:var(--text); font-family:'Space Mono',monospace; font-size:12px; line-height:1.6;
  -webkit-font-smoothing:antialiased; padding-bottom:40px}
.wrap{max-width:480px; margin:0 auto; padding:0 14px}
button{font-family:'Space Mono',monospace; cursor:pointer}
input,select{font-family:'Space Mono',monospace}
:focus-visible{outline:2px solid var(--pink); outline-offset:2px}

/* ---------- wordmark ---------- */
header{text-align:center; padding:18px 16px 14px}
.brand{font-family:'Playfair Display',serif; font-weight:900; font-size:29px; letter-spacing:-.01em; color:var(--text)}
.brand .hrt{font-size:16px; color:var(--pink); vertical-align:22%; margin:0 1px}
.tagline{font-size:8.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--gold); margin-top:7px}

/* ---------- banners (carried over from production) ---------- */
.banner{margin:0 0 10px; padding:10px 13px; border-radius:12px; font-size:11.5px; display:flex; gap:10px; align-items:center; justify-content:space-between}
.banner.booked{background:rgba(230,195,119,.16); border:1px solid rgba(230,195,119,.45); color:var(--gold)}
.banner.tonight{background:var(--pink); color:var(--inkcream); font-weight:700}
.banner.memory{background:var(--card); border:1px dashed rgba(230,195,119,.45); color:var(--gold)}
.banner button{border:0; border-radius:8px; padding:6px 10px; font-weight:700; font-size:11px; flex-shrink:0; background:var(--ground); color:var(--text)}
.banner a{color:inherit}

/* ---------- love ledger strip ---------- */
.strip{margin:0 0 12px; border-radius:14px; background:var(--cream); color:var(--inkcream); display:flex}
.cell{flex:1; padding:12px 8px; text-align:center; position:relative}
.cell+.cell{border-left:1px solid rgba(42,19,43,.14); margin:11px 0; padding-top:1px; padding-bottom:1px}
.cell .k{font-size:8.5px; letter-spacing:.16em; text-transform:uppercase; color:rgba(42,19,43,.5); display:flex; justify-content:center; align-items:center; gap:6px}
.cell .v{font-family:'Playfair Display',serif; font-weight:800; font-size:26px; line-height:1.15}
.cell .v small{font-family:'Space Mono',monospace; font-size:10px; font-weight:400; color:rgba(42,19,43,.55)}
.cell .v.hearts{color:var(--pinkdeep)}
.cell.live .k{color:rgba(31,122,74,.75)}
.cell.live .v{color:var(--greenv)}
.dot{width:8px; height:8px; border-radius:50%; background:var(--green); animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(58,196,124,.6)}100%{box-shadow:0 0 0 7px rgba(58,196,124,0)}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}

/* ---------- stage rail ---------- */
.rail{display:flex; gap:8px; padding:0 0 12px}
.pills-scroll{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none}
.pills-scroll::-webkit-scrollbar{display:none}
.rp{border-radius:999px; padding:8px 0; width:36px; font-weight:700; font-size:11px; letter-spacing:.06em; text-align:center;
  transition:background .15s,color .15s; flex-shrink:0; background:transparent; color:rgba(246,241,232,.45); border:1px solid rgba(255,255,255,.11)}
.rp.done{background:rgba(230,195,119,.14); color:var(--gold); border:1px solid rgba(230,195,119,.45)}
.rp.on{background:var(--pink); color:var(--inkcream); border:1px solid var(--pink)}
.rp.sum{width:auto; padding:8px 14px; margin-left:auto; border:1px solid rgba(230,195,119,.4); color:var(--gold)}
.rp.sum.on{background:var(--gold); color:var(--inkgold); border-color:var(--gold)}

/* ---------- stage body ---------- */
.panelbody{min-height:472px; padding:2px 0 18px}
.kicker{font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:var(--pink)}
h2.stageh{font-family:'Playfair Display',serif; font-weight:800; font-size:25px; margin:6px 0 3px; letter-spacing:0}
.subline{font-size:12px; line-height:1.6; color:var(--t2); margin:0 0 17px}

.grouplabel{font-size:9.5px; letter-spacing:.15em; text-transform:uppercase; color:var(--t3); margin-bottom:8px}
.pillrow{display:flex; flex-wrap:wrap; gap:7px}
.fp{padding:9px 13px; border-radius:999px; font-size:12px; white-space:nowrap; background:var(--card); color:rgba(246,241,232,.72); border:1px solid rgba(255,255,255,.13)}
.fp:hover{background:#332040}
.fp.on{background:var(--pink); color:var(--inkcream); border:1px solid var(--pink)}
.matchline{font-size:11px; color:rgba(246,241,232,.42); margin:14px 0}

.field{width:100%; min-height:44px; padding:11px 12px; border-radius:12px; border:1px solid rgba(255,255,255,.1);
  background:var(--well); color:var(--text); font-size:13px}
.field::placeholder{color:var(--t4)}
select.field{appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23ef6f92'/></svg>"); background-repeat:no-repeat; background-position:right 12px center; padding-right:32px}
label.fl{display:block; font-size:9.5px; letter-spacing:.15em; text-transform:uppercase; color:var(--t3); margin:0 0 6px}
.fgroup{margin-bottom:14px}

.btn{width:100%; padding:14px 16px; border-radius:14px; border:0; font-weight:700; font-size:13.5px; letter-spacing:.03em}
.btn.pink{background:var(--pink); color:var(--inkcream)}
.btn.pink:hover{background:#f382a1}
.btn.gold{background:var(--gold); color:var(--inkgold)}
.btn.gold:hover{background:#edd08d}
.btn.sec{background:transparent; color:rgba(246,241,232,.75); border:1px solid rgba(255,255,255,.14); font-size:12.5px; padding:13px 15px; width:auto}
.btn.sec:hover{background:var(--card)}
.btn.sec.grow{flex:1; width:auto}
.btn.dis{background:rgba(255,255,255,.07); color:rgba(246,241,232,.35); cursor:not-allowed}
.btn.danger{background:transparent; border:1px solid rgba(239,111,146,.5); color:var(--pink)}
.footrow{display:flex; gap:8px; margin-top:20px}
.footrow .btn.pink,.footrow .btn.gold{flex:1; width:auto}

.rowcard{display:flex; gap:11px; align-items:center; padding:13px 14px; border-radius:14px; background:var(--card);
  border:1px solid rgba(255,255,255,.06); color:var(--text); text-align:left; width:100%}
.rowcard .rt{font-family:'Playfair Display',serif; font-weight:700; font-size:15px; line-height:1.3}
.rowcard .rm{font-size:10.5px; color:var(--t3); margin-top:2px}
.rowcard.sel{background:var(--pink); border-color:var(--pink); color:var(--inkcream)}
.rowcard.sel .rm{color:rgba(42,19,43,.7)}
.rowgrid{display:grid; gap:9px}
.chip{padding:4px 9px; border-radius:999px; background:rgba(230,195,119,.16); color:var(--gold); font-size:10px; white-space:nowrap; margin-left:auto; flex-shrink:0}
.dropbtn{width:30px; height:30px; border-radius:50%; border:1px solid rgba(255,255,255,.12); background:transparent; color:rgba(246,241,232,.6); flex-shrink:0}
.dropbtn:hover{border-color:var(--pink); color:var(--pink)}

.callout{border-radius:14px; background:rgba(239,111,146,.12); border:1px solid rgba(239,111,146,.25); padding:12px 14px; margin-bottom:16px;
  font-size:12px; line-height:1.65; color:#f9dbe4}
.dashcard{border:1px dashed rgba(255,255,255,.14); background:var(--card); padding:18px; border-radius:16px; text-align:center; color:var(--t2)}
.dashcard .btn{width:auto; padding:11px 15px; border-radius:12px; margin-top:12px}

.holding{border-radius:14px; padding:12px 14px; background:var(--card); border-left:3px solid var(--pink); margin-bottom:16px}
.holding .hl{font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:rgba(246,241,232,.42)}
.holding .hv{font-family:'Playfair Display',serif; font-weight:700; font-size:16px; margin-top:3px}

.togglecard{width:100%; padding:14px; border-radius:16px; display:flex; flex-direction:column; gap:5px; align-items:flex-start; text-align:left;
  background:var(--card); border:1px solid rgba(255,255,255,.1); color:rgba(246,241,232,.85)}
.togglecard.on{background:rgba(230,195,119,.16); border:1px solid var(--gold); color:var(--text)}
.togglecard .t1{font-family:'Playfair Display',serif; font-weight:700; font-size:15px}
.togglecard .t2x{font-size:10.5px; opacity:.72; font-family:'Space Mono',monospace}

/* clock */
.clockcard{border-radius:18px; padding:24px 18px; background:var(--cream); color:var(--inkcream); text-align:center; margin-bottom:16px}
.clockcard .cl{font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:rgba(42,19,43,.5)}
.clockcard .cv{font-family:'Playfair Display',serif; font-weight:800; font-size:56px; line-height:1; letter-spacing:-.02em; margin:10px 0 6px}
.clockcard .cn{font-size:11px; color:rgba(42,19,43,.55)}

/* hearts */
.hearts{display:flex; align-items:center; min-height:44px}
.hearts button{background:none; border:0; font-size:21px; padding:0 3px; line-height:1; color:rgba(246,241,232,.22); transition:color .12s}
.hearts button.on{color:var(--pink)}

/* map */
#mapbox{height:230px; border-radius:16px; border:1px solid rgba(255,255,255,.08); overflow:hidden; margin-bottom:12px; background:var(--well); position:relative}
#mapbox .mapmsg{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:16px; color:var(--t2); font-size:11px; z-index:400; pointer-events:none}
.leaflet-tile-pane{filter:grayscale(.55) brightness(.62) contrast(1.08) sepia(.28) hue-rotate(-12deg)}
.leaflet-container{background:var(--well); font-family:'Space Mono',monospace}
.leaflet-control-attribution{background:rgba(22,13,27,.78)!important;color:rgba(246,241,232,.5)!important;font-size:8px!important}
.leaflet-control-attribution a{color:rgba(246,241,232,.7)!important}
.leaflet-bar a{background:var(--card)!important;color:var(--text)!important;border-color:rgba(255,255,255,.12)!important}
.leaflet-bar a:hover{background:#3a2440!important}
.pin{display:grid;place-items:center;border-radius:999px;background:var(--pink);color:var(--inkcream);font-size:10px;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.5);cursor:pointer}
.pin.onp{background:var(--gold);box-shadow:0 0 0 6px rgba(230,195,119,.25),0 2px 8px rgba(0,0,0,.5)}
.you{border-radius:999px;background:#6fc3ef;box-shadow:0 0 0 6px rgba(111,195,239,.22)}
.mapbadge{position:absolute;left:10px;bottom:10px;z-index:500;padding:5px 9px;border-radius:999px;background:rgba(22,13,27,.85);
  font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:rgba(246,241,232,.6)}
.leaflet-popup-content-wrapper{background:var(--card);color:var(--text);border-radius:12px}
.leaflet-popup-content{margin:9px 12px;font-size:11px;line-height:1.5}
.leaflet-popup-tip{background:var(--card)}
.radrow{display:flex; justify-content:space-between; align-items:baseline}
.radval{font-size:11px; color:var(--gold)}
input[type=range]{width:100%; accent-color:var(--pink); margin:6px 0 14px}

/* summary */
.sumrow{display:flex; gap:11px; align-items:center; padding:12px 14px; border-radius:14px; background:var(--card); border:1px solid rgba(255,255,255,.06)}
.sumrow .st{font-size:13px; font-weight:700}
.sumrow .sm{font-size:10px; color:rgba(246,241,232,.42); margin-top:2px}
.sumrow .sh{margin-left:auto; font-size:11px; color:var(--pink); letter-spacing:.06em; white-space:nowrap; text-align:right}
.sumrow .sm .mini{background:none; border:0; color:var(--t3); font-size:10px; padding:0; text-decoration:underline}
.sumrow.wd .st{color:var(--pink)}
.moment{font-size:11px; font-style:italic; color:var(--t2); margin-top:3px}
.danger-zone{margin-top:18px; padding-top:16px; border-top:1px solid rgba(255,255,255,.08)}
.fineprint{font-size:10px; color:rgba(246,241,232,.38); text-align:center; margin-top:10px}

/* confirm sheet */
.sheetwrap{position:fixed; inset:0; background:rgba(15,8,19,.72); backdrop-filter:blur(2px); z-index:60; display:none; align-items:flex-end; padding:14px}
.sheetwrap.show{display:flex}
.sheet{width:100%; max-width:452px; margin:0 auto; border-radius:20px; padding:18px; background:var(--card); border:1px solid rgba(255,255,255,.1); box-shadow:0 18px 40px rgba(0,0,0,.5)}
.sheet h3{font-family:'Playfair Display',serif; font-weight:700; font-size:20px; margin:6px 0 12px}
.recap{border-radius:14px; background:var(--well); border:1px solid rgba(255,255,255,.07); padding:12px 14px; margin-bottom:12px}
.recap .rt{font-family:'Playfair Display',serif; font-weight:700; font-size:15px}
.recap .rm{font-size:10.5px; color:rgba(246,241,232,.5); margin-top:2px}
.sheetnote{font-size:11.5px; color:rgba(246,241,232,.5); margin-bottom:14px}

.savedline{font-size:11.5px; color:var(--gold); margin-top:14px; text-align:center}

footer{max-width:480px; margin:0 auto; padding:12px 16px; border-top:1px solid rgba(255,255,255,.06); text-align:center;
  font-size:8px; letter-spacing:.16em; text-transform:uppercase; color:rgba(246,241,232,.32)}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(24px + env(safe-area-inset-bottom)); background:var(--gold); color:var(--inkgold); font-weight:700; font-size:13px; border-radius:10px; padding:10px 16px; opacity:0; pointer-events:none; transition:opacity .25s; z-index:80}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
/* =============================================================
   Book'd — stepped-tab flow. All state lives in localStorage ("bookd.*")
   ============================================================= */
const store = {
  get(k, fb){ try{ const v=localStorage.getItem('bookd.'+k); return v===null?fb:JSON.parse(v); }catch(e){ return fb; } },
  set(k, v){ try{ localStorage.setItem('bookd.'+k, JSON.stringify(v)); }catch(e){} }
};
let entries    = store.get('entries', []);
let reservation= store.get('reservation', null);   // {weekday, time, since}
let planned    = store.get('planned', null);       // {title, date, time?}
let flow       = store.get('flow', {hand:[], picked:null, who:null});
let timer      = store.get('timer', null);         // {startedAt, elapsed, running, date, title}
if(timer && timer.start && timer.startedAt===undefined){ timer={startedAt:timer.start, elapsed:0, running:true, date:timer.date}; store.set('timer',timer); }

const DAY=86400000, MISS_HRS=3;
const WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO=()=>{const d=new Date(); return toISO(d);};
const toISO=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d);};
const fmtDate=s=>parseISO(s).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const monday=d=>{const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x;};
const isDate=e=>(e.type||'date')==='date';
const fmtTime=t=>{const [h,m]=t.split(':').map(Number); const am=h<12; const hh=((h+11)%12)+1; return hh+':'+String(m).padStart(2,'0')+(am?' AM':' PM');};
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }

/* ---------- withdrawals: reservation weeks with no date logged ---------- */
function missedOccurrences(){
  if(!reservation) return [];
  const out=[], since=parseISO(reservation.since), now=new Date(); now.setHours(0,0,0,0);
  const first=new Date(since); first.setDate(first.getDate()+((reservation.weekday-first.getDay()+7)%7));
  const weeksWith=new Set(entries.filter(isDate).map(e=>monday(parseISO(e.date)).getTime()));
  for(let d=new Date(first); d<now; d.setDate(d.getDate()+7)){
    if(!weeksWith.has(monday(d).getTime())) out.push(new Date(d));
  }
  return out;
}

];

/* ---------- ui state (session) ---------- */
const ui={ stage:0, summary:false, planMode:'ideas', justSaved:false };
const filters={cost:'any', where:'any', vibe:'any'};
const near={ ncat:'food', radiusMi:5, query:'', locText:'', coords:null, results:[], sel:null, busy:false, err:null };
let dep={ etype:'date', rating:0, planner:null, editingId:null };  // stage-06 working state
let clockTick=null;

/* ---------- ledger math ---------- */
function stats30(){
  const now=new Date(); now.setHours(0,0,0,0);
  const cutoff=new Date(now.getTime()-30*DAY);
  const recent=entries.filter(e=>parseISO(e.date)>=cutoff);
  const hrs=recent.reduce((s,e)=>s+e.hours,0);
  const missed=missedOccurrences().filter(d=>d>=cutoff).length;
  const rated=recent.filter(e=>isDate(e)&&e.rating>0);
  return {
    balance:hrs-missed*MISS_HRS,
    dates:recent.filter(isDate).length,
    avg: rated.length ? rated.reduce((s,e)=>s+e.rating,0)/rated.length : null,
    missed
  };
}
function elapsedSecs(){ if(!timer) return 0; return Math.floor((timer.elapsed||0)+(timer.running?(Date.now()-timer.startedAt)/1000:0)); }
const fmtMS=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');

function renderStrip(){
  const s=stats30();
  $('#c1v').innerHTML=s.balance.toFixed(1)+'<small> hrs</small>';
  $('#c1v').style.color = s.balance<0 ? '#b0402f' : '';
  $('#c3v').textContent = s.avg!=null ? s.avg.toFixed(1) : '—';
  const live = timer && (timer.running || (timer.elapsed||0)>0);
  $('#c1k').innerHTML='30-Day Balance'+(timer&&timer.running?' <span class="dot"></span>':'');
  const c2=$('#c2');
  if(timer&&timer.running){
    c2.classList.add('live');
    $('#c2k').textContent='Banking now';
    $('#c2v').textContent=fmtMS(elapsedSecs());
  } else {
    c2.classList.remove('live');
    $('#c2k').textContent='Dates / Mo';
    $('#c2v').textContent=s.dates;
  }
}
function startTicking(){
  clearInterval(clockTick);
  clockTick=setInterval(()=>{
    if(timer&&timer.running){
      if($('#c2').classList.contains('live')) $('#c2v').textContent=fmtMS(elapsedSecs());
      const cv=$('#clockv'); if(cv) cv.textContent=fmtMS(elapsedSecs());
    }
  },500);
}

/* ---------- banners (kept from production) ---------- */
function renderBanners(){
  const el=$('#banners'); el.innerHTML='';
  const now=new Date(); now.setHours(0,0,0,0);
  if(planned){
    const days=Math.round((parseISO(planned.date)-now)/DAY);
    if(days>0) el.insertAdjacentHTML('beforeend',
      `<div class="banner booked"><span>Booked: ${esc(planned.title)} · ${fmtDate(planned.date)} — ${days} day${days===1?'':'s'} to go · <a href="${gcalOneOffURL(planned)}" target="_blank" rel="noopener">📆</a></span><button onclick="clearPlanned()">✕</button></div>`);
    else if(days===0) el.insertAdjacentHTML('beforeend',
      `<div class="banner tonight"><span>Tonight: ${esc(planned.title)}. It's on the books.</span><button onclick="goClock()">Clock in</button></div>`);
    else el.insertAdjacentHTML('beforeend',
      `<div class="banner memory"><span>Did "${esc(planned.title)}" happen?</span><button onclick="logPlanned()">Log it</button></div>`);
  }
  if(reservation && new Date().getDay()===reservation.weekday && !(planned && Math.round((parseISO(planned.date)-now)/DAY)===0)){
    el.insertAdjacentHTML('beforeend',
      `<div class="banner tonight"><span>Tonight's the night. ${fmtTime(reservation.time)}, be there.</span></div>`);
  }
  const mmdd=todayISO().slice(5), yr=todayISO().slice(0,4);
  const mem=entries.filter(e=>isDate(e)&&e.date.slice(5)===mmdd&&e.date.slice(0,4)<yr).sort((a,b)=>a.date.localeCompare(b.date))[0];
  if(mem) el.insertAdjacentHTML('beforeend',
    `<div class="banner memory"><span>On this day, ${mem.date.slice(0,4)}: ${esc(mem.title)}${mem.rating?' · '+'♥'.repeat(mem.rating):''}</span></div>`);
}
window.goClock=()=>{ ui.summary=false; ui.stage=4; renderAll(); };
window.clearPlanned=()=>{ planned=null; store.set('planned',null); toast('Booking cleared'); renderAll(); };
window.logPlanned=()=>{
  if(!planned) return;
  const p=planned; planned=null; store.set('planned',null);
  flow.hand=[{n:p.title, cat:'Something new', w:'out'}]; flow.picked=0; saveFlow();
  ui.summary=false; ui.stage=5; dep.editingId=null;
  renderAll();
  $('#d-date') && ($('#d-date').value=p.date);
};

/* ---------- calendar hand-offs (kept) ---------- */
const gcalStamp=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'T'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'00';
function nextOccurrence(){
  const [h,m]=reservation.time.split(':').map(Number);
  const n=new Date(); const d=new Date(); d.setHours(h,m,0,0);
  d.setDate(d.getDate()+((reservation.weekday-d.getDay()+7)%7));
  if(d<=n) d.setDate(d.getDate()+7);
  return d;
}
function gcalWeeklyURL(){
  const s=nextOccurrence(), e=new Date(s.getTime()+2*3600000);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('Date night ♥')
    +'&dates='+gcalStamp(s)+'/'+gcalStamp(e)+'&recur='+encodeURIComponent('RRULE:FREQ=WEEKLY')
    +'&details='+encodeURIComponent("Standing reservation — booked in Book'd");
}
function gcalOneOffURL(p){
  const d1=p.date.replace(/-/g,''), d2=toISO(new Date(parseISO(p.date).getTime()+DAY)).replace(/-/g,'');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(p.title+' ♥')
    +'&dates='+d1+'/'+d2+'&details='+encodeURIComponent("Date booked in Book'd");
}

/* ---------- stage rail ---------- */
function renderRail(){
  const rail=$('#rail');
  rail.innerHTML='<div class="pills-scroll">'+STEPS.map((s,i)=>{
    const cls = ui.summary ? (i<ui.stage?'done':'') : (i===ui.stage?'on':(i<ui.stage?'done':''));
    return `<button class="rp ${cls}" data-s="${i}" aria-label="${esc(s.label)}">${String(i+1).padStart(2,'0')}</button>`;
  }).join('')+'</div>'+`<button class="rp sum ${ui.summary?'on':''}" id="sumpill">Summary</button>`;
  rail.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ ui.summary=false; ui.stage=+b.dataset.s; renderAll(); });
  $('#sumpill').onclick=()=>{ ui.summary=true; renderAll(); };
}

/* ---------- stage bodies ---------- */
function head(i){ const s=STEPS[i]; return `<div class="kicker">${s.kick}</div><h2 class="stageh">${s.label}</h2><p class="subline">${s.sub}</p>`; }
function saveFlow(){ store.set('flow',flow); }
function catAvg(cat){
  const r=entries.filter(e=>isDate(e)&&e.rating>0&&e.cat===cat);
  return r.length?{avg:r.reduce((s,e)=>s+e.rating,0)/r.length, n:r.length}:null;
}
function bestCat(){
  const by={};
  entries.filter(e=>isDate(e)&&e.rating>0).forEach(e=>{const b=by[e.cat]=by[e.cat]||{n:0,s:0}; b.n++; b.s+=e.rating;});
  const rows=Object.entries(by).map(([c,v])=>({c,avg:v.s/v.n,n:v.n})).filter(r=>r.n>=2).sort((a,b)=>b.avg-a.avg);
  return rows[0]||null;
}

/* Stage 01 — Plan */
function st0(){
  const modes=`<div class="pillrow" style="margin-bottom:18px">
    <button class="fp ${ui.planMode==='ideas'?'on':''}" onclick="setMode('ideas')">Idea cards</button>
    <button class="fp ${ui.planMode==='places'?'on':''}" onclick="setMode('places')">Real places near me</button></div>`;
  if(ui.planMode==='ideas'){
    const pool=ideaPool();
    const match = pool.length
      ? `${pool.length} of ${IDEAS.length} ideas match. Three come out — you keep what survives.`
      : 'Nothing matches those three filters — dealing from the whole jar instead.';
    const grp=(label,group,opts)=>`<div style="margin-bottom:14px"><div class="grouplabel">${label}</div><div class="pillrow">`+
      opts.map(([v,t])=>`<button class="fp ${filters[group]===v?'on':''}" onclick="setFilter('${group}','${v}')">${t}</button>`).join('')+'</div></div>';
    return head(0)+modes
      +grp('Budget','cost',[['any','Any'],['1','$'],['2','$$'],['3','$$$']])
      +grp('Setting','where',[['any','Any'],['in','Stay in'],['out','Go out']])
      +grp('Energy','vibe',[['any','Any'],['chill','Chill'],['adv','Adventurous']])
      +`<div class="matchline">${match}</div>
        <button class="btn gold" onclick="deal()">✦ ${pool.length?'Deal three ideas':'Deal anyway'}</button>`;
  }
  /* Mode B — real places near me */
  return head(0)+modes
    +`<div id="mapbox"><div class="mapmsg" id="mapmsg">${near.coords?'':'Map loads once a location is set.'}</div><div class="mapbadge" id="mapbadge"></div></div>
      <div class="fgroup"><label class="fl" for="near-loc">Where (blank = use my location)</label>
        <div style="display:flex; gap:8px">
          <input class="field" type="text" id="near-loc" placeholder="Town or ZIP — or leave blank for GPS" value="${esc(near.locText)}">
          <button class="btn gold" style="width:auto; padding:11px 14px" onclick="setLoc()">Go</button>
        </div></div>
      <div class="fgroup"><input class="field" type="text" id="near-q" placeholder="Filter the list — type part of a name…" value="${esc(near.query)}" oninput="near.query=this.value; updatePlaceList()"></div>
      <div class="radrow"><div class="grouplabel" style="margin:0">How far</div><div class="radval">${near.radiusMi} mi</div></div>
      <input type="range" min="1" max="10" step="1" value="${near.radiusMi}" onchange="setRadius(+this.value)">
      <div style="margin-bottom:14px"><div class="grouplabel">Looking for</div><div class="pillrow">`+
      [['food','Restaurants'],['cafe','Cafés & sweets'],['bar','Bars'],['park','Parks & nature'],['fun','Activities'],['culture','Culture']]
        .map(([v,t])=>`<button class="fp ${near.ncat===v?'on':''}" onclick="setNcat('${v}')">${t}</button>`).join('')
      +`</div></div>`
    +`<div id="placelist">${placeListHTML()}</div>
      <div id="takewrap" style="margin-top:16px">${takeHTML()}</div>`;
}
function placeListHTML(){
  const rows=near.results
    .filter(p=>!near.query || p.name.toLowerCase().includes(near.query.toLowerCase()))
    .slice(0,20);
  return near.busy ? `<div class="matchline">Scanning the neighborhood…</div>`
    : near.err ? `<div class="matchline">${esc(near.err)}</div>`
    : !near.coords ? `<div class="matchline">Set a location to load the map and real places.</div>`
    : !rows.length ? `<div class="matchline">Nothing within ${near.radiusMi} mi matches that. Widen the radius or clear the search.</div>`
    : `<div class="rowgrid">`+rows.map(p=>`
        <button class="rowcard ${near.sel===p.name?'sel':''}" onclick="selPlace('${esc(p.name).replace(/'/g,"\\'")}')">
          <span style="flex:1"><span class="rt">${esc(p.name)}</span><br><span class="rm">${esc(p.kind)}</span></span>
          <span style="font-size:11px; opacity:.75">${(p.km*0.621371).toFixed(1)} mi</span>
        </button>`).join('')+'</div>';
}
function takeHTML(){
  return near.sel
    ? `<button class="btn pink" onclick="takePlace()">Take ${esc(near.sel)} →</button>`
    : `<button class="btn dis" disabled>Pick a spot on the map</button>`;
}
window.updatePlaceList=()=>{
  const pl=$('#placelist'); if(pl) pl.innerHTML=placeListHTML();
  const tw=$('#takewrap'); if(tw) tw.innerHTML=takeHTML();
};
window.setMode=m=>{ ui.planMode=m; renderStage(); if(m==='places') mountMap(); };
window.setFilter=(g,v)=>{ filters[g]=v; renderStage(); };
function ideaPool(){
  return IDEAS.filter(i=>(filters.cost==='any'||i.c===+filters.cost)&&(filters.where==='any'||i.w===filters.where)&&(filters.vibe==='any'||i.v===filters.vibe));
}
window.deal=()=>{
  let pool=ideaPool(); if(!pool.length) pool=[...IDEAS];
  const hand=[]; const src=[...pool];
  while(hand.length<3&&src.length) hand.push(src.splice(Math.floor(Math.random()*src.length),1)[0]);
  flow.hand=hand; flow.picked=null; saveFlow();
  ui.stage=1; renderAll();
};

/* Stage 02 — Decide */
function st1(){
  const best=bestCat();
  const callout = best
    ? `You rate <b>${esc(best.c.toLowerCase())}</b> nights ${best.avg.toFixed(1)}♥ across ${best.n} dates — your best-performing category. Drop whatever you already know is a maybe.`
    : 'Nothing logged yet, so nothing to argue with. Keep all three.';
  if(!flow.hand.length) return head(1)+`<div class="dashcard">Your hand is empty — nothing left to argue about.<br><button class="btn gold" onclick="ui.stage=0;renderAll()">✦ Deal three ideas</button></div>`;
  return head(1)
    +`<div class="callout">${callout}</div>
      <div class="rowgrid">`+flow.hand.map((h,i)=>{
        const a=h.cat?catAvg(h.cat):null;
        return `<div class="rowcard"><span style="flex:1"><span class="rt">${esc(h.n)}</span><br>
          <span class="rm">${esc([h.cat,h.c?'$'.repeat(h.c):null,h.w?(h.w==='in'?'stay in':'go out'):null].filter(Boolean).join(' · '))}</span></span>
          <span class="chip">${a?a.avg.toFixed(1)+'♥ avg':'new ground'}</span>
          <button class="dropbtn" title="Back in the jar" onclick="dropIdea(${i})">✕</button></div>`;
      }).join('')+'</div>'
    +`<div class="footrow"><button class="btn sec" onclick="ui.stage=0;renderAll()">↺ Re-deal</button>
      <button class="btn pink" onclick="ui.stage=2;renderAll()">These are the finalists</button></div>`;
}
window.dropIdea=i=>{ flow.hand.splice(i,1); flow.picked=null; saveFlow(); renderStage(); };

/* Stage 03 — Choose */
function st2(){
  if(!flow.hand.length) return head(2)+`<div class="dashcard">Nothing to choose from yet — start at Plan.<br><button class="btn gold" onclick="ui.stage=0;renderAll()">✦ Deal three ideas</button></div>`;
  return head(2)
    +`<div class="rowgrid">`+flow.hand.map((h,i)=>`
      <button class="rowcard ${flow.picked===i?'sel':''}" style="flex-direction:column; gap:5px; align-items:flex-start" onclick="pick(${i})">
        <span class="rt" style="font-size:16px">${esc(h.n)}</span>
        <span class="rm" style="opacity:.7">${esc([h.cat,h.c?'$'.repeat(h.c):null,h.w?(h.w==='in'?'stay in':'go out'):null].filter(Boolean).join(' · '))}</span>
      </button>`).join('')+'</div>'
    +`<div class="footrow"><button class="btn sec" onclick="ui.stage=1;renderAll()">←</button>
      ${flow.picked!=null
        ? `<button class="btn pink" onclick="ui.stage=3;renderAll()">That's the one →</button>`
        : `<button class="btn dis" style="flex:1" disabled>Pick one to continue</button>`}</div>`;
}
window.pick=i=>{ flow.picked=i; saveFlow(); renderStage(); };

/* Stage 04 — Book it */
function st3(){
  const plan=flow.picked!=null?flow.hand[flow.picked]:null;
  const defDate = planned?planned.date:toISO(new Date(Date.now()+2*DAY));
  const defTime = (planned&&planned.time)||(reservation&&reservation.time)||'19:00';
  const calRow = planned ? `<div class="rowgrid" style="margin-top:14px">
      <a class="btn sec" style="text-align:center; text-decoration:none" href="${gcalOneOffURL(planned)}" target="_blank" rel="noopener">📆 Add this date to Google Calendar</a>
      ${reservation?`<a class="btn sec" style="text-align:center; text-decoration:none" href="${gcalWeeklyURL()}" target="_blank" rel="noopener">📆 Add the weekly slot to Google Calendar</a>`:''}
    </div><div class="savedline">Reserved ♥ — it's on the books.</div>`:'';
  return head(3)
    +`<div class="holding"><div class="hl">Holding</div><div class="hv">${esc(plan?plan.n:(planned?planned.title:'Pick a plan at Choose — or book a freestyle night'))}</div></div>
      <div style="display:flex; gap:10px; margin-bottom:14px">
        <div style="flex:1"><label class="fl" for="b-date">Date</label><input class="field" type="date" id="b-date" value="${defDate}"></div>
        <div style="width:126px"><label class="fl" for="b-time">At</label><input class="field" type="time" id="b-time" value="${defTime}"></div>
      </div>
      <div class="fgroup"><div class="grouplabel">Who's booking it</div><div class="pillrow">
        <button class="fp ${flow.who!=='partner'?'on':''}" onclick="flow.who='me';saveFlow();renderStage()">Me</button>
        <button class="fp ${flow.who==='partner'?'on':''}" onclick="flow.who='partner';saveFlow();renderStage()">My partner</button></div></div>
      <button class="togglecard ${reservation?'on':''}" onclick="toggleStanding()">
        <span class="t1">${reservation?'♥':'○'} Make it standing</span>
        <span class="t2x">${reservation
          ?`Repeats every ${WD[reservation.weekday]} at ${fmtTime(reservation.time)} until one of you cancels.`
          :'Same slot every week — the reservation that survives a busy month.'}</span>
      </button>
      <div class="footrow"><button class="btn sec" onclick="ui.stage=2;renderAll()">←</button>
        <button class="btn pink" onclick="reserveIt()">Reserve it ♥</button></div>`
    +calRow;
}
window.toggleStanding=()=>{
  if(reservation){ reservation=null; store.set('reservation',null); toast('Standing reservation cancelled'); renderAll(); return; }
  const date=$('#b-date')?$('#b-date').value:todayISO(), time=$('#b-time')?$('#b-time').value:'19:00';
  reservation={ weekday:parseISO(date).getDay(), time, since:todayISO() };
  store.set('reservation',reservation); toast('Standing · every '+WD[reservation.weekday]); renderAll();
};
window.reserveIt=()=>{
  const date=$('#b-date').value, time=$('#b-time').value;
  if(!date) return toast('Pick the day');
  const plan=flow.picked!=null?flow.hand[flow.picked]:null;
  planned={ title:plan?plan.n:'Date night', date, time };
  store.set('planned',planned);
  toast('Reserved ♥ '+fmtDate(date));
  renderAll();
};

/* Stage 05 — On the clock */
function st4(){
  const secs=elapsedSecs();
  const state = timer&&timer.running?'running':(timer&&secs>0?'paused':'idle');
  const note = state==='running'?'Running. Put the phone down.'
    : state==='paused'?`Paused — ${(secs/3600).toFixed(1)} hrs banked so far.`
    : 'Nothing banked yet. Start it when the night starts.';
  const btn = state==='idle'?`<button class="btn pink" onclick="clockStart()">⏱ Start the date clock</button>`
    : state==='running'?`<button class="btn gold" onclick="clockPause()">⏸ Pause the clock</button>`
    : `<button class="btn pink" onclick="clockResume()">▶ Resume the clock</button>`;
  const plan=flow.picked!=null?flow.hand[flow.picked]:null;
  return head(4)
    +`<div class="clockcard"><div class="cl">${esc((timer&&timer.title)||(plan?plan.n:(planned?planned.title:'Tonight')))}</div>
       <div class="cv" id="clockv">${fmtMS(secs)}</div><div class="cn">${note}</div></div>`
    +btn
    +`<div class="footrow"><button class="btn sec" onclick="ui.stage=3;renderAll()">←</button>
      <button class="btn sec grow" onclick="wrapUp()">Wrap it up →</button></div>`;
}
window.wrapUp=()=>{ if(timer&&timer.running){ timer.elapsed=(timer.elapsed||0)+(Date.now()-timer.startedAt)/1000; timer.running=false; store.set('timer',timer); } ui.stage=5; renderAll(); };
window.clockStart=()=>{
  const plan=flow.picked!=null?flow.hand[flow.picked]:null;
  timer={startedAt:Date.now(), elapsed:0, running:true, date:todayISO(), title:plan?plan.n:(planned?planned.title:null)};
  store.set('timer',timer); toast('Date clock started ♥'); renderAll();
};
window.clockPause=()=>{ timer.elapsed=(timer.elapsed||0)+(Date.now()-timer.startedAt)/1000; timer.running=false; store.set('timer',timer); renderAll(); };
window.clockResume=()=>{ timer.startedAt=Date.now(); timer.running=true; store.set('timer',timer); renderAll(); };

/* Stage 06 — Rate the Date */
function st5(){
  const plan=flow.picked!=null?flow.hand[flow.picked]:null;
  const secs=elapsedSecs();
  const mins=Math.max(secs>0?1:0, Math.round(secs/60));
  if(dep.hours==null && !dep._auto && mins>0){ dep._auto=true; if(mins<45) dep.etype='small'; }  // short clock → everyday moment
  const small = dep.etype==='small';
  const defTitle = dep.title!=null?dep.title:(timer&&timer.title)||(plan?plan.n:(planned?planned.title:''));
  const defHours = dep.hours!=null?dep.hours:(mins>0 ? (small?mins:Math.max(0.1,Math.round(mins/6)/10)) : (small?30:2.5));
  const defDate = dep.date || (timer&&timer.date) || (planned?planned.date:todayISO());
  const cats=['Food & drink','Movies & shows','Outdoors','At home','Music & culture','Active','Something new'];
  const defCat = dep.cat || (plan&&plan.cat) || 'Food & drink';
  return head(5)
    +`<div style="margin-bottom:14px" class="pillrow">
        <button class="fp ${!small?'on':''}" onclick="dep.etype='date';renderStage()">Date night</button>
        <button class="fp ${small?'on':''}" onclick="dep.etype='small';renderStage()">Everyday moment</button></div>
      <div class="fgroup"><label class="fl" for="d-title">What you did</label>
        <input class="field" type="text" id="d-title" maxlength="60" value="${esc(defTitle)}" placeholder="${small?'Morning walk, phones at home':'Dinner at that new ramen place'}"></div>
      <div style="display:flex; gap:10px" class="fgroup">
        <div style="flex:1"><label class="fl" for="d-date">Date</label><input class="field" type="date" id="d-date" value="${defDate}"></div>
        <div style="width:126px"><label class="fl" for="d-cat">Category</label>
          <select class="field" id="d-cat">${cats.map(c=>`<option ${c===defCat?'selected':''}>${c}</option>`).join('')}</select></div>
      </div>
      <div style="display:flex; gap:12px; align-items:flex-start" class="fgroup">
        <div style="width:104px"><label class="fl" for="d-hours" id="d-hours-label">${small?'Minutes':'Hours'}</label>
          <input class="field" type="number" id="d-hours" min="${small?1:0.1}" max="${small?600:24}" step="${small?1:0.1}" value="${defHours}"></div>
        <div style="flex:1"><label class="fl">How was it?</label>
          <div class="hearts">${[1,2,3,4,5].map(i=>`<button title="${i} of 5" class="${dep.rating>=i?'on':''}" onclick="dep.rating=${i};renderStage(true)">♥</button>`).join('')}</div></div>
      </div>
      <div class="fgroup"><label class="fl" for="d-moment">Best moment (optional)</label>
        <input class="field" type="text" id="d-moment" maxlength="120" value="${esc(dep.moment||'')}" placeholder="The part you don't want to forget"></div>
      <div class="fgroup"><div class="grouplabel">Who booked it?</div><div class="pillrow">
        <button class="fp ${dep.planner==='me'?'on':''}" onclick="dep.planner=dep.planner==='me'?null:'me';renderStage(true)">Me</button>
        <button class="fp ${dep.planner==='partner'?'on':''}" onclick="dep.planner=dep.planner==='partner'?null:'partner';renderStage(true)">My partner</button></div></div>
      <button class="btn pink" onclick="openDepositSheet()">${dep.editingId?'Update this date':'Deposit this date'}</button>
      ${dep.editingId?`<button class="btn sec" style="width:100%; margin-top:10px" onclick="cancelEdit()">Cancel edit</button>`:''}
      ${ui.justSaved?`<div class="savedline">Deposited ♥ — balance updated. The receipt is in <b>Summary</b>.</div>`:''}`;
}
function grabDep(){
  dep.title=$('#d-title')?$('#d-title').value:dep.title;
  dep.date=$('#d-date')?$('#d-date').value:dep.date;
  dep.cat=$('#d-cat')?$('#d-cat').value:dep.cat;
  dep.hours=$('#d-hours')?$('#d-hours').value:dep.hours;
  dep.moment=$('#d-moment')?$('#d-moment').value:dep.moment;
}
window.cancelEdit=()=>{ dep={etype:'date',rating:0,planner:null,editingId:null}; ui.justSaved=false; renderStage(); toast('Edit cancelled'); };
window.openDepositSheet=()=>{
  grabDep();
  const title=(dep.title||'').trim(), raw=parseFloat(dep.hours);
  if(!title) return toast('Give it a name');
  if(!dep.date) return toast('Pick the date');
  if(!(raw>0)) return toast(dep.etype==='small'?'How many minutes?':'How many hours?');
  const small=dep.etype==='small';
  const meta = small ? Math.round(raw)+' min' : raw+' hrs';
  const rate = dep.rating>0 ? '♥'.repeat(dep.rating) : 'no rating yet (saves as 4♥)';
  const note = (dep.moment||'').trim() ? '“'+esc(dep.moment.trim())+'”'
    : 'It lands in Summary and updates your balance. No best moment saved — you can still add one later.';
  openSheet(`
    <div class="kicker">Confirm deposit</div><h3>Put this on the books?</h3>
    <div class="recap"><div class="rt">${esc(title)}</div><div class="rm">${meta} · ${rate}</div></div>
    <div class="sheetnote">${note}</div>
    <div class="footrow" style="margin-top:0">
      <button class="btn sec grow" onclick="closeSheet()">Keep editing</button>
      <button class="btn pink" onclick="commitDeposit()">Yes, deposit it ♥</button></div>`);
};
window.commitDeposit=()=>{
  closeSheet();
  const small=dep.etype==='small', raw=parseFloat(dep.hours);
  const record={ id:dep.editingId??Date.now(), title:dep.title.trim(), date:dep.date,
    hours: small?raw/60:raw, cat:dep.cat, rating:dep.rating||(small?0:4),
    type:small?'small':'date', planner:dep.planner||flow.who||null, moment:(dep.moment||'').trim()||null };
  if(dep.editingId){ entries=entries.map(e=>e.id===dep.editingId?record:e); toast('Entry updated'); }
  else { entries.unshift(record); toast(small?'Deposited +'+Math.round(raw)+' min':'Deposited +'+record.hours.toFixed(1)+' hrs'); }
  store.set('entries',entries);
  if(planned && planned.title===record.title){ planned=null; store.set('planned',null); }
  if(!(timer && timer.running && record.date!==timer.date)){ timer=null; store.set('timer',null); }  // backfilling an old date never kills tonight's running clock
  flow={hand:[], picked:null, who:null}; saveFlow();
  dep={etype:'date',rating:0,planner:null,editingId:null};
  ui.justSaved=true;
  renderAll();
};

/* ---------- Summary ---------- */
function stSummary(){
  const s=stats30();
  const all=entries.length, hrs=entries.reduce((t,e)=>t+e.hours,0);
  const weeks=new Set(entries.filter(isDate).map(e=>monday(parseISO(e.date)).getTime()));
  let streak=0, w=monday(new Date()).getTime();
  if(!weeks.has(w)) w-=7*DAY;
  while(weeks.has(w)){ streak++; w-=7*DAY; }
  const me=entries.filter(e=>isDate(e)&&e.planner==='me').length, pa=entries.filter(e=>isDate(e)&&e.planner==='partner').length;
  const rows=[
    ...entries.map(e=>({sort:e.date, html:`
      <div class="sumrow"><span style="flex:1"><span class="st">${esc(e.title)}</span>
        <div class="sm">${fmtDate(e.date)} · ${isDate(e)?esc(e.cat):'Everyday moment'} · ${isDate(e)?e.hours.toFixed(1)+' hrs':Math.round(e.hours*60)+' min'}${e.planner?` · booked by ${e.planner==='me'?'me':'partner'}`:''}
          · <button class="mini" onclick="editEntry(${e.id})">edit</button> · <button class="mini" onclick="delEntry(${e.id})">delete</button></div>
        ${e.moment?`<div class="moment">“${esc(e.moment)}”</div>`:''}</span>
      <span class="sh">${e.rating?'♥'.repeat(e.rating):''}</span></div>`})),
    ...missedOccurrences().map(d=>{const iso=toISO(d); return {sort:iso, html:`
      <div class="sumrow wd"><span style="flex:1"><span class="st">Missed date night</span>
        <div class="sm">${fmtDate(iso)} · no date logged · −${MISS_HRS.toFixed(1)} hrs</div></span></div>`};})
  ].sort((a,b)=>b.sort.localeCompare(a.sort));
  const best=bestCat();
  return `<div class="kicker">Ledger · account statement</div><h2 class="stageh">Summary</h2>
    <p class="subline">${all} deposit${all===1?'':'s'} · ${hrs.toFixed(1)} hrs on the books · ${streak} wk streak${(me+pa)?` · booked by me ${me} / partner ${pa}`:''}</p>
    ${best?`<div class="callout">Best investment: <b>${esc(best.c.toLowerCase())}</b> — ${best.avg.toFixed(1)}♥ average across ${best.n} dates. Book more of these.</div>`:''}
    ${rows.length?`<div class="rowgrid">${rows.map(r=>r.html).join('')}</div>`
      :`<div class="dashcard">No transactions yet. Log your first date to open the account. ♥</div>`}
    <div class="footrow"><button class="btn sec grow" id="backup-btn">⬇ Back up</button><button class="btn sec grow" id="restore-btn">⬆ Restore</button></div>
    <div class="fineprint">Your ledger lives only on this device. Keep a copy somewhere safe.</div>
    <div class="danger-zone"><button class="btn danger" onclick="openWipeSheet()">Close the account (erase everything)</button></div>
    <input type="file" id="restore-file" accept="application/json,.json" hidden>
    <button class="btn sec" style="width:100%; margin-top:18px" onclick="ui.summary=false;renderAll()">← Back to stage ${String(ui.stage+1).padStart(2,'0')}</button>`;
}
window.editEntry=id=>{
  const e=entries.find(x=>x.id===id); if(!e) return;
  dep={ etype:isDate(e)?'date':'small', rating:e.rating||0, planner:e.planner||null, editingId:id,
    title:e.title, date:e.date, cat:e.cat, moment:e.moment||'',
    hours: isDate(e)?e.hours:Math.round(e.hours*60) };
  ui.summary=false; ui.stage=5; ui.justSaved=false; renderAll();
};
window.delEntry=id=>{ entries=entries.filter(e=>e.id!==id); store.set('entries',entries); renderAll(); toast('Removed'); };
window.openWipeSheet=()=>{
  openSheet(`
    <div class="kicker">Close the account</div><h3>Erase everything?</h3>
    <div class="sheetnote">This erases every deposit, the balance, your reservation and bookings — everything on this phone. <b>There is no undo.</b> Consider Back up first.</div>
    <div class="footrow" style="margin-top:0">
      <button class="btn sec grow" onclick="closeSheet()">Never mind</button>
      <button class="btn pink" style="background:#e2694f" onclick="wipeAll()">Yes — erase it all</button></div>`);
};
window.wipeAll=()=>{
  closeSheet();
  Object.keys(localStorage).filter(k=>k.startsWith('bookd.')).forEach(k=>localStorage.removeItem(k));
  entries=[]; reservation=null; planned=null; timer=null; flow={hand:[],picked:null,who:null};
  dep={etype:'date',rating:0,planner:null,editingId:null};
  renderAll(); toast('Account closed — fresh books');
};
function wireSummary(){
  const b=$('#backup-btn'); if(!b) return;
  b.onclick=()=>{
    const data={app:'bookd', exported:todayISO(), entries, reservation, planned};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='bookd-backup-'+todayISO()+'.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    toast('Backup downloaded');
  };
  $('#restore-btn').onclick=()=>$('#restore-file').click();
  $('#restore-file').onchange=ev=>{
    const f=ev.target.files[0]; ev.target.value=''; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ try{
      const d=JSON.parse(r.result);
      if(d.app!=='bookd'||!Array.isArray(d.entries)) throw 0;
      openSheet(`<div class="kicker">Restore</div><h3>Replace everything with the backup?</h3>
        <div class="sheetnote">${d.entries.length} entries from ${esc(d.exported||'an earlier backup')}. This overwrites what's on this phone.</div>
        <div class="footrow" style="margin-top:0"><button class="btn sec grow" onclick="closeSheet()">Cancel</button>
        <button class="btn pink" id="do-restore">Restore it</button></div>`);
      $('#do-restore').onclick=()=>{ closeSheet();
        entries=d.entries; reservation=d.reservation||null; planned=d.planned||null;
        store.set('entries',entries); store.set('reservation',reservation); store.set('planned',planned);
        renderAll(); toast('Ledger restored'); };
    }catch(e){ toast("That file isn't a Book'd backup"); } };
    r.readAsText(f);
  };
}

/* ---------- sheet ---------- */
function openSheet(html){ $('#sheet').innerHTML=html; $('#sheetwrap').classList.add('show'); }
window.closeSheet=()=>{ $('#sheetwrap').classList.remove('show'); };
$('#sheetwrap').addEventListener('click',e=>{ if(e.target.id==='sheetwrap') closeSheet(); });

/* ---------- real places nearby (production engine, kept) ---------- */
const NEAR_TAGS={
  food:['amenity=restaurant'], cafe:['amenity=cafe','amenity=ice_cream'],
  bar:['amenity=bar','amenity=pub','amenity=biergarten'],
  park:['leisure=park','leisure=nature_reserve','leisure=garden','tourism=viewpoint'],
  fun:['amenity=cinema','leisure=bowling_alley','leisure=escape_game','leisure=miniature_golf','leisure=ice_rink','leisure=amusement_arcade','tourism=zoo','tourism=aquarium'],
  culture:['tourism=museum','tourism=gallery','amenity=theatre']
};
const NEAR_KIND={food:'Restaurant', cafe:'Café', bar:'Bar', park:'Park & nature', fun:'Activity', culture:'Culture'};
const OVERPASS_EPS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter'];
const PHOTON_QS={ food:['restaurant','grill','pizza','bistro','diner'], cafe:['cafe','coffee','ice cream','bakery'],
  bar:['bar','pub','brewery','taproom'], park:['park','garden','nature reserve','trail'],
  fun:['cinema','bowling','escape room','mini golf','arcade'], culture:['museum','gallery','theatre'] };
function haversine(a,b){ const R=6371,toR=x=>x*Math.PI/180;
  const s=Math.sin(toR(b.lat-a.lat)/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(toR(b.lon-a.lon)/2)**2;
  return 2*R*Math.asin(Math.sqrt(s)); }
async function overpassNear(cat,rad,c){
  const sel=NEAR_TAGS[cat].map(t=>{const [k,v]=t.split('='); return `nwr["${k}"="${v}"]["name"](around:${rad},${c.lat},${c.lon});`;}).join('');
  const q='data='+encodeURIComponent(`[out:json][timeout:12];(${sel});out center 60;`);
  const ask=ep=>fetch(ep,{method:'POST',body:q,headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:AbortSignal.timeout(13000)})
    .then(r=>{ if(!r.ok) throw 0; return r.json(); });
  try{
    const j=await Promise.any(OVERPASS_EPS.map(ask)); const seen=new Set();
    return j.elements.map(el=>({name:el.tags&&el.tags.name, lat:el.lat??(el.center&&el.center.lat), lon:el.lon??(el.center&&el.center.lon)}))
      .filter(p=>p.name&&p.lat&&!seen.has(p.name)&&seen.add(p.name))
      .map(p=>({...p, km:haversine(c,p), kind:NEAR_KIND[cat]}));
  }catch(e){ return null; }
}
async function photonNear(cat,rad,c){
  const dLat=rad/111320, dLon=rad/(111320*Math.cos(c.lat*Math.PI/180));
  const bbox=[c.lon-dLon,c.lat-dLat,c.lon+dLon,c.lat+dLat].map(x=>x.toFixed(4)).join(',');
  const results=await Promise.all(PHOTON_QS[cat].map(term=>
    fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(term)}&bbox=${bbox}&limit=20`)
      .then(r=>r.ok?r.json():{features:[]}).catch(()=>({features:[]}))));
  const seen=new Set(), out=[];
  results.forEach(j=>(j.features||[]).forEach(f=>{
    const name=f.properties&&f.properties.name; if(!name||seen.has(name)) return; seen.add(name);
    const [lon,lat]=f.geometry.coordinates;
    out.push({name, lat, lon, km:haversine(c,{lat,lon}), kind:NEAR_KIND[cat]});
  }));
  return out.filter(p=>p.km<=rad/1000+0.5);
}
async function fetchNear(){
  if(!near.coords) return;
  near.busy=true; near.err=null; updatePlaceList();
  try{
    const rad=Math.round(near.radiusMi*1609.34);
    let list=await overpassNear(near.ncat, rad, near.coords);
    if(!list||!list.length) list=await photonNear(near.ncat, rad, near.coords);
    near.results=(list||[]).sort((a,b)=>a.km-b.km);
    if(!near.results.length && list===null) near.err='The free map services are all busy — try again in a few minutes.';
  }catch(e){ near.err='The map services are not answering — try again in a minute.'; near.results=[]; }
  near.busy=false; updatePlaceList(); mapDraw(true);
}
window.setNcat=v=>{ near.ncat=v; near.sel=null; renderStage(true); fetchNear(); };
window.setRadius=v=>{ near.radiusMi=v; near.sel=null; renderStage(true); fetchNear(); };
window.setLoc=async()=>{
  near.locText=$('#near-loc')?$('#near-loc').value.trim():'';
  near.busy=true; near.err=null; updatePlaceList();
  try{
    if(near.locText){
      const isZip=/^\d{5}$/.test(near.locText);
      const url='https://nominatim.openstreetmap.org/search?format=json&limit=1&'+
        (isZip ? 'postalcode='+near.locText+'&countrycodes=us' : 'q='+encodeURIComponent(near.locText));
      const j=await fetch(url).then(r=>r.json());
      if(!Array.isArray(j)||!j.length) throw new Error(`Couldn't find "${near.locText}" — try adding the state`);
      near.coords={lat:+j[0].lat, lon:+j[0].lon, label:(j[0].display_name||near.locText).split(',')[0]};
    } else {
      near.coords=await new Promise((res,rej)=>{
        if(!navigator.geolocation) return rej(new Error('No GPS here — type a town instead'));
        navigator.geolocation.getCurrentPosition(
          p=>res({lat:p.coords.latitude, lon:p.coords.longitude, label:'your location'}),
          ()=>rej(new Error('Location blocked — type a town instead')),
          {timeout:10000, maximumAge:600000});
      });
    }
    mountMap(); fetchNear();
  }catch(err){ near.busy=false; near.err=err.message; updatePlaceList(); }
};
window.selPlace=name=>{ near.sel=name; updatePlaceList(); mapDraw(false); };
window.takePlace=()=>{
  const p=near.results.find(x=>x.name===near.sel); if(!p) return;
  const catMap={food:'Food & drink',cafe:'Food & drink',bar:'Food & drink',park:'Outdoors',fun:'Active',culture:'Music & culture'};
  flow.hand=[{n:p.name, cat:catMap[near.ncat], w:'out'}]; flow.picked=0; saveFlow();
  ui.stage=3; renderAll();
};

/* ---------- map (Leaflet, per handoff spec) ---------- */
let map=null, mapMarkers=[], mapRing=null, mapYou=null;
const zoomFor=r=>r<=2?14:r<=4?13:r<=7?12:11.25;
function mountMap(){
  if(ui.planMode!=='places'||!near.coords) return;
  if(!window.L){ const m=$('#mapmsg'); if(m) m.textContent='The map library could not load — check your connection and try again.'; return; }
  setTimeout(()=>{
    const box=$('#mapbox'); if(!box) return;
    if(map){ map.remove(); map=null; }
    $('#mapmsg')&&($('#mapmsg').textContent='');
    map=L.map(box,{center:[near.coords.lat,near.coords.lon], zoom:zoomFor(near.radiusMi), zoomControl:true, zoomSnap:0.25});
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors', maxZoom:19}).addTo(map);
    mapYou=L.marker([near.coords.lat,near.coords.lon],{icon:L.divIcon({className:'',html:'<div class="you" style="width:12px;height:12px"></div>',iconSize:[12,12],iconAnchor:[6,6]}),interactive:false,keyboard:false}).addTo(map);
    mapDraw(true);
  },50);
}
function mapDraw(recenter){
  if(!map||!near.coords) return;
  mapMarkers.forEach(m=>map.removeLayer(m)); mapMarkers=[];
  if(mapRing) map.removeLayer(mapRing);
  mapRing=L.circle([near.coords.lat,near.coords.lon],{radius:near.radiusMi*1609.34,color:'#ef6f92',weight:1,opacity:.35,fillColor:'#ef6f92',fillOpacity:.05,interactive:false}).addTo(map);
  near.results.slice(0,40).forEach(p=>{
    const on=p.name===near.sel, s=on?30:22;
    const m=L.marker([p.lat,p.lon],{icon:L.divIcon({className:'',html:`<div class="pin${on?' onp':''}" style="width:${s}px;height:${s}px;font-size:${on?14:10}px">♥</div>`,iconSize:[s,s],iconAnchor:[s/2,s/2]}),title:p.name}).addTo(map);
    m.bindPopup(`<strong>${esc(p.name)}</strong><br>${esc(p.kind)} · ${(p.km*0.621371).toFixed(1)} mi`);
    m.on('click',()=>{ near.sel=p.name; renderStage(true); mapDraw(false); });
    mapMarkers.push(m);
  });
  const badge=$('#mapbadge'); if(badge) badge.textContent=(near.coords.label||'')+' · '+near.radiusMi+' mi';
  if(recenter) map.setView([near.coords.lat,near.coords.lon], zoomFor(near.radiusMi));
}

/* ---------- render ---------- */
function renderStage(keepScroll){
  const stagers=[st0,st1,st2,st3,st4,st5];
  const inPlaces = !ui.summary && ui.stage===0 && ui.planMode==='places';
  if(map && !inPlaces){ map.remove(); map=null; mapMarkers=[]; mapRing=null; }
  const liveMap = (inPlaces && map) ? $('#mapbox') : null;   // keep the living map across re-renders
  $('#stagebox').innerHTML = ui.summary ? stSummary() : stagers[ui.stage]();
  if(liveMap && $('#mapbox')) $('#mapbox').replaceWith(liveMap);
  if(ui.summary) wireSummary();
  if(inPlaces && near.coords && !map) mountMap();
}
function renderAll(){ renderStrip(); renderBanners(); renderRail(); renderStage(); }

/* ---------- boot ---------- */
if(timer&&timer.running) ui.stage=4;
else if(planned && planned.date===todayISO()) ui.stage=4;
renderAll(); startTicking();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
