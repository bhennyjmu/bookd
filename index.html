<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D1320">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Book'd — your relationship, on the books</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Karla:wght@400;500;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous" defer></script>
<style>
:root{
  --plum:#1D1320; --card:#2A1B2E; --rose:#F27D98; --champagne:#E9C580;
  --deposit:#8FD6A8; --withdrawal:#F08A7E; --cream:#F6EFE3; --ink:#2A1B2E;
  --dim:rgba(246,239,227,.6); --dimmer:rgba(246,239,227,.38);
  --green:#2f9e63; --greenv:#1f7a4a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%; color-scheme:dark}
body{background:var(--plum); color:var(--cream); font-family:'Karla',sans-serif; font-size:16px; line-height:1.5;
  padding:0 0 calc(86px + env(safe-area-inset-bottom))}
.mono{font-family:'Spline Sans Mono',monospace}
.wrap{max-width:480px; margin:0 auto; padding:0 16px}
:focus-visible{outline:2px solid var(--rose); outline-offset:1px}

/* ---------- header ---------- */
header{text-align:center; padding:26px 16px 6px}
.brand{font-family:'Fraunces',serif; font-weight:900; font-size:34px; letter-spacing:-.5px; color:var(--cream)}
.brand .hrt{color:var(--rose); font-size:24px; vertical-align:6%}
.tagline{font-family:'Spline Sans Mono',monospace; font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--rose); margin-top:6px}

/* ---------- banners ---------- */
.banner{margin:14px 0 0; padding:12px 14px; border-radius:12px; font-size:14.5px; display:flex; gap:10px; align-items:center; justify-content:space-between}
.banner.tonight{background:var(--rose); color:var(--plum); font-weight:700}
.banner.booked{background:rgba(233,197,128,.16); border:1px solid rgba(233,197,128,.5); color:var(--champagne)}
.banner.memory{background:var(--card); border:1px dashed var(--champagne); color:var(--champagne)}
.banner button{border:0; border-radius:8px; padding:7px 12px; font-family:'Karla'; font-weight:700; font-size:13px; cursor:pointer; flex-shrink:0; background:var(--plum); color:var(--cream)}
.banner a{color:inherit}

/* ---------- passbook: The Joint Account ---------- */
.passbook{background:var(--cream); color:var(--ink); border-radius:14px 14px 0 0;
  margin-top:20px; padding:18px 20px 30px; position:relative; text-align:center;
  box-shadow:0 12px 40px rgba(0,0,0,.45)}
.pb-head{display:flex; justify-content:space-between; align-items:baseline; border-bottom:2px solid var(--ink); padding-bottom:9px; text-align:left}
.pb-title{font-family:'Fraunces',serif; font-weight:700; font-size:17px}
.acct{font-family:'Spline Sans Mono',monospace; font-size:10px; letter-spacing:.12em; color:rgba(42,27,46,.55)}
.balance-label{font-family:'Spline Sans Mono',monospace; font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:rgba(42,27,46,.55); margin-top:18px;
  display:flex; justify-content:center; align-items:center; gap:7px}
.balance{font-family:'Spline Sans Mono',monospace; font-weight:600; font-size:52px; letter-spacing:2px; line-height:1.05}
.balance small{font-size:20px; font-weight:500; letter-spacing:0}
.balance.neg{color:#B0402F}
.balance-sub{font-size:12.5px; color:rgba(42,27,46,.65); margin-top:2px}
.pb-rule{border:0; border-top:1.5px dashed rgba(42,27,46,.3); margin:16px 0 14px}
.pb-stats{display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:8px}
.stat .v{font-family:'Spline Sans Mono',monospace; font-weight:600; font-size:22px}
.stat .v.hearts{color:#d4527a}
.stat .k{font-family:'Spline Sans Mono',monospace; font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:rgba(42,27,46,.55); margin-top:2px}
.stat.live .v{color:var(--greenv); animation:glow 1.8s ease-in-out infinite}
.stat.live .k{color:rgba(31,122,74,.75)}
@keyframes glow{0%,100%{text-shadow:0 0 0 rgba(47,158,99,0)}50%{text-shadow:0 0 14px rgba(47,158,99,.55)}}
.pb-split{font-family:'Spline Sans Mono',monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:rgba(42,27,46,.55); margin-top:14px}
.goalrow{margin-top:14px}
.goaltrack{height:7px; border-radius:999px; background:rgba(42,27,46,.15); overflow:hidden}
.goalfill{height:100%; border-radius:999px; transition:width .4s}
.goalfill.lo{background:#B0402F}
.goalfill.mid{background:#C99A3F}
.goalfill.done{background:var(--green)}
.goaltext{font-family:'Spline Sans Mono',monospace; font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:rgba(42,27,46,.55); margin-top:6px}
.goaltext.lo{color:#B0402F; font-weight:600}
.goaltext.done{color:var(--greenv)}
.tear{position:absolute; left:0; right:0; bottom:-7px; height:16px; overflow:hidden; text-align:center;
  color:var(--plum); font-size:15px; letter-spacing:5px; line-height:14px; user-select:none; pointer-events:none}
.dot{width:8px; height:8px; border-radius:50%; background:var(--green); display:none; animation:pulse 1.8s ease-out infinite}
.dot.show{display:inline-block}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(58,196,124,.6)}100%{box-shadow:0 0 0 7px rgba(58,196,124,0)}}
@media (prefers-reduced-motion:reduce){.dot,.stat.live .v{animation:none}}

/* ---------- sections & cards ---------- */
.sechead{display:flex; align-items:baseline; gap:12px; margin:34px 0 14px}
.sechead h2{font-family:'Fraunces',serif; font-weight:700; font-size:22px; white-space:nowrap}
.sechead .lead{flex:1; border-bottom:1.5px dotted rgba(246,239,227,.25); transform:translateY(-4px)}
.sechead .tag{font-family:'Spline Sans Mono',monospace; font-size:9.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--rose); white-space:nowrap}
.cardbox{background:var(--card); border-radius:14px; padding:18px 16px}
label.f{display:block; font-family:'Spline Sans Mono',monospace; font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--dimmer); margin:0 0 6px}
.fgroup{margin-bottom:14px}
input[type=text],input[type=date],input[type=number],input[type=time],select{
  width:100%; background:var(--plum); border:1px solid rgba(246,239,227,.12); border-radius:10px;
  color:var(--cream); font-family:'Karla'; font-size:16px; padding:11px 12px; appearance:none}
input::placeholder{color:var(--dimmer)}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23F27D98'/></svg>"); background-repeat:no-repeat; background-position:right 12px center; padding-right:32px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.hearts{display:flex; gap:5px}
.hearts button{background:none; border:0; font-size:24px; cursor:pointer; color:rgba(246,239,227,.2); padding:2px; line-height:1}
.hearts button.on{color:var(--rose)}
.cta{width:100%; margin-top:16px; border:0; border-radius:12px;
  font-family:'Karla'; font-weight:700; font-size:16px; padding:14px; cursor:pointer}
.cta.pink{background:var(--rose); color:var(--plum)}
.cta.gold{background:var(--champagne); color:var(--plum)}
.cta.ghost{background:transparent; color:var(--rose); border:1px solid var(--rose)}
.cta.ghostd{background:transparent; color:var(--dim); border:1px solid rgba(246,239,227,.2)}
.cta.danger{background:transparent; color:var(--withdrawal); border:1px solid rgba(240,138,126,.45)}
.cta:active{transform:translateY(1px)}
.divline{font-family:'Spline Sans Mono',monospace; font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--dimmer); text-align:center; margin:14px 0 16px}
.row2{display:flex; gap:8px}
.row2 .cta{margin-top:10px}
.savedline{font-family:'Spline Sans Mono',monospace; font-size:11.5px; color:var(--champagne); margin-top:14px; text-align:center}

/* ---------- pills ---------- */
.pillgroup{margin-bottom:12px}
.pills{display:flex; gap:6px; flex-wrap:wrap}
.pill{background:var(--plum); border:1px solid rgba(246,239,227,.14); color:var(--dim); border-radius:999px; padding:6px 14px; font-size:13px; font-family:'Karla'; font-weight:500; cursor:pointer}
.pill.on{background:var(--rose); border-color:var(--rose); color:var(--plum); font-weight:700}
.pill.gold.on{background:var(--champagne); border-color:var(--champagne); color:var(--plum); font-weight:700}

/* ---------- roulette ---------- */
.spin-card{background:var(--plum); border:1px dashed rgba(246,239,227,.2); border-radius:12px; min-height:96px; margin-top:14px; padding:18px; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:6px}
.spin-card.show{display:flex}
.spin-idea{font-family:'Fraunces',serif; font-size:22px; font-weight:700; line-height:1.2}
.spin-meta{font-family:'Spline Sans Mono',monospace; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--dimmer)}
.spin-meta a{color:var(--rose)}
.spin-empty{color:var(--dimmer); font-size:14px}
.favs{margin-top:16px}
.fav{display:flex; justify-content:space-between; align-items:center; border-bottom:1px dotted rgba(246,239,227,.15); padding:9px 2px; font-size:14.5px; cursor:pointer}
.fav button{background:none; border:0; color:var(--dimmer); font-size:16px; cursor:pointer}
.eyebrow{font-family:'Spline Sans Mono',monospace; font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--dimmer)}
.countdown{font-family:'Spline Sans Mono',monospace; font-size:26px; font-weight:600; color:var(--champagne); margin-top:10px}
.countdown .u{font-size:12px; color:var(--dimmer); margin-right:8px}
.callout{border-radius:12px; background:rgba(242,125,152,.12); border:1px solid rgba(242,125,152,.3); padding:12px 14px; margin:0 0 14px; font-size:14px; line-height:1.55; color:#F9DBE4}
.secsub{font-size:13.5px; color:var(--dim); line-height:1.55; margin:-6px 0 12px}

/* ---------- map ---------- */
#mapbox{height:230px; border-radius:14px; border:1px solid rgba(246,239,227,.1); overflow:hidden; margin-bottom:12px; background:var(--plum); position:relative}
#mapbox .mapmsg{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:16px; color:var(--dim); font-size:13px; z-index:400; pointer-events:none}
.leaflet-tile-pane{filter:grayscale(.55) brightness(.62) contrast(1.08) sepia(.28) hue-rotate(-12deg)}
.leaflet-container{background:var(--plum); font-family:'Spline Sans Mono',monospace}
.leaflet-control-attribution{background:rgba(29,19,32,.78)!important;color:rgba(246,239,227,.5)!important;font-size:8px!important}
.leaflet-control-attribution a{color:rgba(246,239,227,.7)!important}
.leaflet-bar a{background:var(--card)!important;color:var(--cream)!important;border-color:rgba(246,239,227,.12)!important}
.pin{display:grid;place-items:center;border-radius:999px;background:var(--rose);color:var(--plum);font-size:10px;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.5);cursor:pointer}
.pin.onp{background:var(--champagne);box-shadow:0 0 0 6px rgba(233,197,128,.25),0 2px 8px rgba(0,0,0,.5)}
.you{border-radius:999px;background:#6fc3ef;box-shadow:0 0 0 6px rgba(111,195,239,.22)}
.mapbadge{position:absolute;left:10px;bottom:10px;z-index:500;padding:5px 9px;border-radius:999px;background:rgba(29,19,32,.85);
  font-family:'Spline Sans Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:rgba(246,239,227,.6)}
.leaflet-popup-content-wrapper{background:var(--card);color:var(--cream);border-radius:12px}
.leaflet-popup-content{margin:9px 12px;font-size:11px;line-height:1.5}
.leaflet-popup-tip{background:var(--card)}
.radrow{display:flex; justify-content:space-between; align-items:baseline}
.radval{font-family:'Spline Sans Mono',monospace; font-size:11px; color:var(--champagne)}
input[type=range]{width:100%; accent-color:var(--rose); margin:6px 0 12px}
.place{display:flex; justify-content:space-between; align-items:center; gap:10px; border-bottom:1px dotted rgba(246,239,227,.15); padding:10px 2px; font-size:14.5px; cursor:pointer}
.place.sel .pn{color:var(--rose); font-weight:700}
.place .pd{font-family:'Spline Sans Mono',monospace; font-size:11px; color:var(--dimmer); white-space:nowrap}
.statusline{font-family:'Spline Sans Mono',monospace; font-size:11.5px; color:var(--dim); margin-top:10px; min-height:1.2em}

/* ---------- history (statement, per Brad's pic) ---------- */
.entry{display:flex; justify-content:space-between; gap:10px; padding:14px 2px; border-bottom:1px dotted rgba(246,239,227,.15)}
.entry:last-child{border-bottom:0}
.entry .t{font-weight:700; font-size:15.5px}
.entry .m{font-family:'Spline Sans Mono',monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--dimmer); margin-top:3px}
.entry .m .hearts-s{color:var(--rose); letter-spacing:1px}
.entry .moment{font-size:13px; font-style:italic; color:var(--dim); margin-top:3px}
.entry .amt{font-family:'Spline Sans Mono',monospace; font-weight:600; font-size:16px; white-space:nowrap; text-align:right}
.entry .amt.dep{color:var(--deposit)}
.entry .amt.wd{color:var(--withdrawal)}
.entry .links{font-size:12.5px; color:var(--dimmer); text-align:right; margin-top:3px}
.entry .links button{background:none; border:0; color:var(--dimmer); cursor:pointer; font-size:12.5px; padding:0}
.entry .links button:hover{color:var(--rose)}
.empty{font-family:'Spline Sans Mono',monospace; color:var(--dim); text-align:center; padding:24px 10px; font-size:13.5px; line-height:1.7}
.empty .hrt{color:var(--rose)}
.datanote{font-family:'Spline Sans Mono',monospace; font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--dimmer); text-align:center; margin-top:10px}
.danger-zone{margin-top:18px; padding-top:16px; border-top:1px solid rgba(246,239,227,.1)}

/* ---------- month calendar ---------- */
.cal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px}
.cal-title{font-family:'Fraunces',serif; font-weight:700; font-size:17px}
.cal-nav{width:32px; height:32px; border-radius:50%; border:1px solid rgba(246,239,227,.2); background:transparent; color:var(--cream); font-size:16px; cursor:pointer}
.cal-nav:hover{border-color:var(--rose); color:var(--rose)}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center}
.cal-dow{font-family:'Spline Sans Mono',monospace; font-size:9px; letter-spacing:.1em; color:var(--dimmer); padding:4px 0}
.cal-cell{min-height:44px; border-radius:8px; padding:3px 0; position:relative; cursor:pointer}
.cal-cell:hover{background:rgba(246,239,227,.06)}
.cal-cell.today{outline:1.5px solid var(--rose); outline-offset:-1.5px}
.cal-cell.empty{visibility:hidden}
.cal-cell .cn2{font-family:'Spline Sans Mono',monospace; font-size:12px; color:var(--dim)}
.cd{display:inline-block; font-size:10px; line-height:1}
.cd.past{color:var(--rose)}
.cd.fut{color:var(--champagne)}
.cal-cell .cd{display:block; margin-top:1px}
.cal-legend{font-family:'Spline Sans Mono',monospace; font-size:9px; letter-spacing:.08em; color:var(--dimmer); text-align:center; margin-top:10px}

/* ---------- confirm sheet ---------- */
.sheetwrap{position:fixed; inset:0; background:rgba(20,12,22,.75); backdrop-filter:blur(2px); z-index:60; display:none; align-items:flex-end; padding:14px; padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.sheetwrap.show{display:flex}
.sheet{width:100%; max-width:452px; margin:0 auto; border-radius:18px; padding:18px; background:var(--card); border:1px solid rgba(246,239,227,.12); box-shadow:0 18px 40px rgba(0,0,0,.5)}
.sheet .eyebrow{color:var(--rose)}
.sheet h3{font-family:'Fraunces',serif; font-weight:700; font-size:21px; margin:6px 0 12px}
.recap{border-radius:12px; background:var(--plum); border:1px solid rgba(246,239,227,.1); padding:12px 14px; margin-bottom:12px}
.recap .rt{font-family:'Fraunces',serif; font-weight:700; font-size:16px}
.recap .rm{font-family:'Spline Sans Mono',monospace; font-size:10.5px; color:var(--dim); margin-top:3px}
.sheetnote{font-size:13.5px; color:var(--dim); margin-bottom:6px}

/* ---------- bottom tab bar (mobile banking style) ---------- */
.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:50; background:#241629; border-top:1px solid rgba(246,239,227,.1);
  padding-bottom:env(safe-area-inset-bottom)}
.tabbar .inner{max-width:480px; margin:0 auto; display:flex}
.tabbar button{flex:1; background:none; border:0; cursor:pointer; padding:10px 4px 12px; color:var(--dimmer);
  display:flex; flex-direction:column; align-items:center; gap:3px}
.tabbar .ico{font-size:20px; line-height:1}
.tabbar .lbl{font-family:'Spline Sans Mono',monospace; font-size:9px; letter-spacing:.18em; text-transform:uppercase}
.tabbar button.on{color:var(--rose)}
.tabbar button.on .ico{transform:translateY(-1px)}

footer{max-width:480px; margin:40px auto 0; padding:0 16px; text-align:center}
footer p{font-family:'Spline Sans Mono',monospace; font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:var(--dimmer)}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(96px + env(safe-area-inset-bottom)); background:var(--champagne); color:var(--plum); font-weight:700; font-size:14px; border-radius:10px; padding:10px 16px; opacity:0; pointer-events:none; transition:opacity .25s; z-index:70}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="brand">Book<span class="hrt">♥</span>d</div>
  <div class="tagline">Your relationship, on the books</div>
</header>

<div class="wrap">
  <div id="banners"></div>
  <div id="page"></div>
</div>

<footer><p>Book'd · Member FDIC (For Dates I've Clocked)</p></footer>

<nav class="tabbar"><div class="inner">
  <button data-t="0" class="on"><span class="ico">⌂</span><span class="lbl">Home</span></button>
  <button data-t="1"><span class="ico">✦</span><span class="lbl">Plan</span></button>
  <button data-t="2"><span class="ico">▦</span><span class="lbl">Calendar</span></button>
  <button data-t="3"><span class="ico">⚙</span><span class="lbl">Settings</span></button>
</div></nav>

<div class="sheetwrap" id="sheetwrap"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* =============================================================
   Book'd — Home / Plan / History with a bottom tab bar.
   All state lives in localStorage ("bookd.*")
   ============================================================= */
const store = {
  get(k, fb){ try{ const v=localStorage.getItem('bookd.'+k); return v===null?fb:JSON.parse(v); }catch(e){ return fb; } },
  set(k, v){ try{ localStorage.setItem('bookd.'+k, JSON.stringify(v)); }catch(e){} }
};
let entries    = store.get('entries', []);
let reservation= store.get('reservation', null);
let plans      = store.get('plans', null);   // future bookings — a LIST now; two spouses, many dates
if(!Array.isArray(plans)){ const old=store.get('planned',null); plans=old?[{id:Date.now(), ...old}]:[]; store.set('plans',plans); }
let favorites  = store.get('favorites', []);
let lastSpin   = store.get('lastSpin', null);
let timer      = store.get('timer', null);   // {startedAt, elapsed, running, date, title}
let goal       = store.get('goal', null);    // monthly hours goal (number) — the low-balance baseline
let profile    = store.get('profile', {me:'', partner:'', anniv:''});   // first names + anniversary
const nameMe=()=>profile.me||'Me', namePa=()=>profile.partner||'My partner';
const kidsOn=()=>profile.kids!==false;   // sitter tracking on unless switched off in Settings
const plansSorted=()=>[...plans].sort((a,b)=>a.date.localeCompare(b.date));
const todayPlan=()=>plans.find(p=>p.date===todayISO());
const nextPlan=()=>plansSorted().find(p=>p.date>todayISO());
const overduePlan=()=>plansSorted().find(p=>p.date<todayISO());
const planById=id=>plans.find(p=>p.id===id);
function savePlans(){ store.set('plans',plans); pushMeta(); }

/* ---------- joint-account sync (Firebase Firestore, couple-code pairing) ---------- */
const FIREBASE_CONFIG={apiKey:"AIzaSyBHfJKxOrHlfM65zVSOwbUXblPcuHvm94Q",authDomain:"bookd-78e02.firebaseapp.com",
  projectId:"bookd-78e02",storageBucket:"bookd-78e02.firebasestorage.app",messagingSenderId:"956683695194",
  appId:"1:956683695194:web:08718c5597ecbc8e831463"};   // public identifiers — security lives in the Firestore rules

const DAY=86400000, MISS_HRS=3;
const WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const toISO=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d);};
const fmtDate=s=>parseISO(s).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const monday=d=>{const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x;};
const isDate=e=>(e.type||'date')==='date';
const fmtTime=t=>{const [h,m]=t.split(':').map(Number); const am=h<12; const hh=((h+11)%12)+1; return hh+':'+String(m).padStart(2,'0')+(am?' AM':' PM');};
const fmtMS=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }

const CADENCE={ weekly:{step:7, label:'every week', interval:1},
  biweekly:{step:14, label:'every other week', interval:2},
  monthly:{step:28, label:'once a month', interval:4} };
const resvCad=()=>CADENCE[(reservation&&reservation.cadence)||'weekly'];
function firstOccurrence(){
  const first=parseISO(reservation.since);
  first.setDate(first.getDate()+((reservation.weekday-first.getDay()+7)%7));
  return first;
}
function missedOccurrences(){
  if(!reservation) return [];
  const step=resvCad().step, out=[], now=new Date(); now.setHours(0,0,0,0);
  const dates=entries.filter(isDate).map(e=>parseISO(e.date).getTime());
  for(let d=firstOccurrence(); d.getTime()+step*DAY<=now.getTime(); d.setDate(d.getDate()+step)){
    const a=d.getTime(), b=a+step*DAY;   // "between this date night and the next, did you date at all?"
    if(!dates.some(t=>t>=a&&t<b)) out.push(new Date(d));
  }
  return out;
}
function resvTonight(){
  if(!reservation) return false;
  const today=new Date(); today.setHours(0,0,0,0);
  const diff=Math.round((today-firstOccurrence())/DAY);
  return diff>=0 && diff%resvCad().step===0;
}

/* ---------- ledger math ---------- */
const elapsedSecs=()=>!timer?0:Math.floor((timer.elapsed||0)+(timer.running?(Date.now()-timer.startedAt)/1000:0));
function stats(){
  const now=new Date(); now.setHours(0,0,0,0);
  const cutoff=new Date(now.getTime()-30*DAY);
  const recent=entries.filter(e=>parseISO(e.date)>=cutoff);
  const hrs=recent.reduce((s,e)=>s+e.hours,0);
  const missed=missedOccurrences().filter(d=>d>=cutoff).length;
  const rated=recent.filter(e=>isDate(e)&&e.rating>0);
  const weeks=new Set(entries.filter(isDate).map(e=>monday(parseISO(e.date)).getTime()));
  let streak=0, w=monday(new Date()).getTime();
  if(!weeks.has(w)) w-=7*DAY;
  while(weeks.has(w)){ streak++; w-=7*DAY; }
  return {
    balance:hrs-missed*MISS_HRS,
    dates:recent.filter(isDate).length,
    avg: rated.length?rated.reduce((s,e)=>s+e.rating,0)/rated.length:null,
    streak,
    hrsWk: entries.filter(e=>parseISO(e.date)>=new Date(now.getTime()-28*DAY)).reduce((s,e)=>s+e.hours,0)/4,
    me: entries.filter(e=>isDate(e)&&e.planner==='me').length,
    pa: entries.filter(e=>isDate(e)&&e.planner==='partner').length
  };
}

  closeSheet();

  const record={ id:dep.editingId??Date.now(), title:dep.title.trim(), date:dep.date,
    hours: small?raw/60:raw, cat:dep.cat||'Food & drink', rating:dep.rating||(small?0:4),
    type:small?'small':'date', planner:dep.planner||null, moment:(dep.moment||'').trim()||null, by:sync?sync.role:null };
  if(dep.editingId){ entries=entries.map(e=>e.id===dep.editingId?record:e); toast('Entry updated'); }
  else { entries.unshift(record); toast(small?'Deposited +'+Math.round(raw)+' min':'Deposited +'+record.hours.toFixed(1)+' hrs'); }
  store.set('entries',entries);
  pushEntry(record);
  const pix=plans.findIndex(p=>p.title===record.title);
  if(pix>-1){ plans.splice(pix,1); savePlans(); }
  if(!(timer && timer.running && record.date!==timer.date)){ timer=null; store.set('timer',null); }
  dep={etype:'date',rating:0,planner:null,editingId:null};

};

const NEAR_TAGS={
  food:['amenity=restaurant'], cafe:['amenity=cafe','amenity=ice_cream'],
  bar:['amenity=bar','amenity=pub','amenity=biergarten'],
  park:['leisure=park','leisure=nature_reserve','leisure=garden','tourism=viewpoint'],
  fun:['amenity=cinema','leisure=bowling_alley','leisure=escape_game','leisure=miniature_golf','leisure=ice_rink','leisure=amusement_arcade','tourism=zoo','tourism=aquarium'],
  culture:['tourism=museum','tourism=gallery','amenity=theatre']
};
const NEAR_KIND={food:'Restaurant', cafe:'Café', bar:'Bar', park:'Park & nature', fun:'Activity', culture:'Culture'};
const OVERPASS_EPS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter'];
const PHOTON_QS={ food:['restaurant','grill','pizza','bistro','diner'], cafe:['cafe','coffee','ice cream','bakery'],
  bar:['bar','pub','brewery','taproom'], park:['park','garden','nature reserve','trail'],
  fun:['cinema','bowling','escape room','mini golf','arcade'], culture:['museum','gallery','theatre'] };
function haversine(a,b){ const R=6371,toR=x=>x*Math.PI/180;
  const s=Math.sin(toR(b.lat-a.lat)/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(toR(b.lon-a.lon)/2)**2;
  return 2*R*Math.asin(Math.sqrt(s)); }
async function overpassNear(cat,rad,c){
  const sel=NEAR_TAGS[cat].map(t=>{const [k,v]=t.split('='); return `nwr["${k}"="${v}"]["name"](around:${rad},${c.lat},${c.lon});`;}).join('');
  const q='data='+encodeURIComponent(`[out:json][timeout:12];(${sel});out center 60;`);
  const ask=ep=>fetch(ep,{method:'POST',body:q,headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:AbortSignal.timeout(13000)})
    .then(r=>{ if(!r.ok) throw 0; return r.json(); });
  try{
    const j=await Promise.any(OVERPASS_EPS.map(ask)); const seen=new Set();
    return j.elements.map(el=>({name:el.tags&&el.tags.name, lat:el.lat??(el.center&&el.center.lat), lon:el.lon??(el.center&&el.center.lon)}))
      .filter(p=>p.name&&p.lat&&!seen.has(p.name)&&seen.add(p.name))
      .map(p=>({...p, km:haversine(c,p), kind:NEAR_KIND[cat]}));
  }catch(e){ return null; }
}
async function photonNear(cat,rad,c){
  const dLat=rad/111320, dLon=rad/(111320*Math.cos(c.lat*Math.PI/180));
  const bbox=[c.lon-dLon,c.lat-dLat,c.lon+dLon,c.lat+dLat].map(x=>x.toFixed(4)).join(',');
  const results=await Promise.all(PHOTON_QS[cat].map(term=>
    fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(term)}&bbox=${bbox}&limit=20`)
      .then(r=>r.ok?r.json():{features:[]}).catch(()=>({features:[]}))));
  const seen=new Set(), out=[];
  results.forEach(j=>(j.features||[]).forEach(f=>{
    const name=f.properties&&f.properties.name; if(!name||seen.has(name)) return; seen.add(name);
    const [lon,lat]=f.geometry.coordinates;
    out.push({name, lat, lon, km:haversine(c,{lat,lon}), kind:NEAR_KIND[cat]});
  }));
  return out.filter(p=>p.km<=rad/1000+0.5);
}
async function fetchNear(){
  if(!near.coords) return;
  near.busy=true; near.err=null; updatePlaceList();
  try{
    const rad=Math.round(near.radiusMi*1609.34);
    let list=await overpassNear(near.ncat, rad, near.coords);
    if(!list||!list.length) list=await photonNear(near.ncat, rad, near.coords);
    near.results=(list||[]).sort((a,b)=>a.km-b.km);
    if(!near.results.length && list===null) near.err='The free map services are all busy — try again in a few minutes.';
  }catch(e){ near.err='The map services are not answering — try again in a minute.'; near.results=[]; }
  near.busy=false; updatePlaceList(); mapDraw(true);
}
window.setNcat=v=>{ near.ncat=v; near.sel=null; renderPage(); fetchNear(); };
window.setRadius=v=>{ near.radiusMi=v; near.sel=null; renderPage(); fetchNear(); };
window.setLoc=async()=>{
  near.locText=$('#near-loc')?$('#near-loc').value.trim():'';
  near.busy=true; near.err=null; updatePlaceList();
  try{
    if(near.locText){
      const isZip=/^\d{5}$/.test(near.locText);
      const url='https://nominatim.openstreetmap.org/search?format=json&limit=1&'+
        (isZip ? 'postalcode='+near.locText+'&countrycodes=us' : 'q='+encodeURIComponent(near.locText));
      const j=await fetch(url).then(r=>r.json());
      if(!Array.isArray(j)||!j.length) throw new Error(`Couldn't find "${near.locText}" — try adding the state`);
      near.coords={lat:+j[0].lat, lon:+j[0].lon, label:(j[0].display_name||near.locText).split(',')[0]};
    } else {
      near.coords=await new Promise((res,rej)=>{
        if(!navigator.geolocation) return rej(new Error('No GPS here — type a town instead'));
        navigator.geolocation.getCurrentPosition(
          p=>res({lat:p.coords.latitude, lon:p.coords.longitude, label:'your location'}),
          ()=>rej(new Error('Location blocked — type a town instead')),
          {timeout:10000, maximumAge:600000});
      });
    }
    mountMap(); fetchNear();
  }catch(err){ near.busy=false; near.err=err.message; updatePlaceList(); }
};

let map=null, mapMarkers=[], mapRing=null;
const zoomFor=r=>r<=2?14:r<=4?13:r<=7?12:11.25;
function mountMap(){
  if(!(ui.tab===1&&ui.planMode==='places')||!near.coords) return;
  if(!window.L){ const m=$('#mapmsg'); if(m) m.textContent='The map library could not load — check your connection and try again.'; return; }
  setTimeout(()=>{
    const box=$('#mapbox'); if(!box) return;
    if(map){ map.remove(); map=null; }
    const mm=$('#mapmsg'); if(mm) mm.textContent='';
    map=L.map(box,{center:[near.coords.lat,near.coords.lon], zoom:zoomFor(near.radiusMi), zoomControl:true, zoomSnap:0.25});
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors', maxZoom:19}).addTo(map);
    L.marker([near.coords.lat,near.coords.lon],{icon:L.divIcon({className:'',html:'<div class="you" style="width:12px;height:12px"></div>',iconSize:[12,12],iconAnchor:[6,6]}),interactive:false,keyboard:false}).addTo(map);
    mapDraw(true);
  },50);
}
function mapDraw(recenter){
  if(!map||!near.coords) return;
  mapMarkers.forEach(m=>map.removeLayer(m)); mapMarkers=[];
  if(mapRing) map.removeLayer(mapRing);
  mapRing=L.circle([near.coords.lat,near.coords.lon],{radius:near.radiusMi*1609.34,color:'#F27D98',weight:1,opacity:.35,fillColor:'#F27D98',fillOpacity:.05,interactive:false}).addTo(map);
  near.results.slice(0,40).forEach(p=>{
    const on=p.name===near.sel, s=on?30:22;
    const m=L.marker([p.lat,p.lon],{icon:L.divIcon({className:'',html:`<div class="pin${on?' onp':''}" style="width:${s}px;height:${s}px;font-size:${on?14:10}px">♥</div>`,iconSize:[s,s],iconAnchor:[s/2,s/2]}),title:p.name}).addTo(map);
    m.bindPopup(`<strong>${esc(p.name)}</strong><br>${esc(p.kind)} · ${(p.km*0.621371).toFixed(1)} mi`);
    m.on('click',()=>{ selPlace(p.name); });
    mapMarkers.push(m);
  });
  const badge=$('#mapbadge'); if(badge) badge.textContent=(near.coords.label||'')+' · '+near.radiusMi+' mi';
  if(recenter) map.setView([near.coords.lat,near.coords.lon], zoomFor(near.radiusMi));
}

window.openDay=iso=>{

/* ---------- sync engine ---------- */
const fmtCode=c=>c.replace(/(.{4})/g,'$1-').replace(/-$/,'');
function newCid(){ const chars='ABCDEFGHJKMNPQRSTVWXYZ0123456789'; const a=new Uint32Array(20);
  crypto.getRandomValues(a); let s=''; for(let i=0;i<20;i++) s+=chars[a[i]%chars.length]; return s; }
function ensureDb(){
  if(db) return db;
  if(!window.fb) return null;
  const app = window.fb.getApps().length ? window.fb.getApp() : window.fb.initializeApp(FIREBASE_CONFIG);
  try{ db=window.fb.initializeFirestore(app,{localCache:window.fb.persistentLocalCache()}); }
  catch(e){ db=window.fb.getFirestore(app); }
  return db;
}
const metaRef=()=>window.fb.doc(db,'couples',sync.cid);
const entryRef=id=>window.fb.doc(db,'couples',sync.cid,'entries',String(id));
const metaPayload=()=>({profile, reservation, plans, goal, favorites, lastBy:sync?sync.role:null, updatedAt:Date.now()});
function startSync(){
  if(!sync||!ensureDb()) return;
  syncStatus='connecting';
  const oldSeen=seenAt;
  let firstMeta=true, firstEntries=true;
  const away={dep:0, book:0};
  const noteAway=()=>{
    if(away.dep||away.book){
      ui.awayNote=`While you were away — ${esc(partnerName())} `+
        [away.dep?`deposited ${away.dep} date${away.dep===1?'':'s'}`:null,
         away.book?`booked ${away.book} night${away.book===1?'':'s'}`:null].filter(Boolean).join(' · ')+' ♥';
    }
    seenAt=Date.now(); store.set('seenAt', seenAt);
  };
  unsubMeta=window.fb.onSnapshot(metaRef(), snap=>{
    syncStatus='live';
    const d=snap.data();
    if(d && !snap.metadata.hasPendingWrites){
      const prevIds=new Set(plans.map(p=>p.id));
      profile=d.profile||profile; reservation=d.reservation??null;
      plans=Array.isArray(d.plans)?d.plans:(d.planned?[{id:1, ...d.planned}]:plans);
      goal=d.goal??null; favorites=d.favorites||[];
      store.set('profile',profile); store.set('reservation',reservation); store.set('plans',plans);
      store.set('goal',goal); store.set('favorites',favorites);
      if(firstMeta){
        away.book = plans.filter(p=>p.by && p.by!==sync.role && (p.id||0)>oldSeen).length;
        noteAway(); firstMeta=false;
      } else {
        plans.filter(p=>!prevIds.has(p.id) && p.by && p.by!==sync.role).forEach(p=>
          toast(partnerName()+' booked '+p.title+' · '+fmtDate(p.date)+' ♥'));
      }
      renderAll();
    } else if(firstMeta && d===undefined){ firstMeta=false; }
  }, ()=>{ syncStatus='error'; renderAll(); });
  unsubEntries=window.fb.onSnapshot(window.fb.collection(db,'couples',sync.cid,'entries'), snap=>{
    syncStatus='live';
    if(firstEntries){
      away.dep = snap.docs.map(x=>x.data()).filter(e=>e.by && e.by!==sync.role && (e.id||0)>oldSeen).length;
      noteAway(); firstEntries=false;
    } else {
      snap.docChanges().forEach(ch=>{
        if(ch.type==='added' && !ch.doc.metadata.hasPendingWrites){
          const e=ch.doc.data();
          if(e.by && e.by!==sync.role)
            toast(partnerName()+' just deposited '+(e.type==='small'?Math.round(e.hours*60)+' min':e.hours.toFixed(1)+' hrs')+' ♥');
        }
      });
    }
    entries=snap.docs.map(d=>d.data())
      .sort((a,b)=>String(b.date).localeCompare(String(a.date))||((b.id||0)-(a.id||0)));
    store.set('entries',entries);
    renderAll();
  }, ()=>{ syncStatus='error'; renderAll(); });
}
function stopSync(){ if(unsubMeta)unsubMeta(); if(unsubEntries)unsubEntries(); unsubMeta=unsubEntries=null; syncStatus='off'; }
function pushMeta(){ if(sync&&db) window.fb.setDoc(metaRef(), metaPayload(), {merge:true}).catch(()=>{}); }
function pushEntry(r){ if(sync&&db) window.fb.setDoc(entryRef(r.id), r).catch(()=>{}); }
function pushDelete(id){ if(sync&&db) window.fb.deleteDoc(entryRef(id)).catch(()=>{}); }
window.setPairRole=r=>{ pairRole=r; renderPage(); };
window.openVault=async()=>{
  if(!ensureDb()) return toast('Sync engine still loading — try again in a moment');
  sync={cid:newCid(), role:pairRole}; store.set('sync',sync);
  try{
    await window.fb.setDoc(metaRef(), metaPayload(), {merge:true});
    const b=window.fb.writeBatch(db);
    entries.forEach(r=>b.set(entryRef(r.id), r));
    await b.commit();
  }catch(e){ sync=null; store.set('sync',null); return toast('The vault door stuck — check your connection and try again'); }
  startSync();
  toast('Vault open ♥ — send Marilee the code');
  renderAll();
};
window.joinVault=async()=>{
  if(!ensureDb()) return toast('Sync engine still loading — try again in a moment');
  const cid=($('#sync-code')?$('#sync-code').value:'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(cid.length<16) return toast('That code looks short — check it and try again');
  let snap=null;
  try{ snap=await window.fb.getDoc(window.fb.doc(db,'couples',cid)); }catch(e){}
  if(!snap||!snap.exists()) return toast("Couldn't find that vault — double-check the code");
  sync={cid, role:pairRole}; store.set('sync',sync);
  try{
    const localOnly=[...entries];
    const b=window.fb.writeBatch(db);
    localOnly.forEach(r=>b.set(entryRef(r.id), r, {merge:true}));
    await b.commit();
  }catch(e){}
  startSync();
  toast('Joined the joint account ♥');
  renderAll();
};
window.copyCode=()=>{
  if(!sync) return;
  (navigator.clipboard?navigator.clipboard.writeText(fmtCode(sync.cid)):Promise.reject())
    .then(()=>toast('Code copied — text it to your co-signer'))
    .catch(()=>toast(fmtCode(sync.cid)));
};
window.shareCode=()=>{
  if(!sync) return;
  if(navigator.share) navigator.share({title:"Book'd joint account", text:"Join our Book'd joint account — Settings → Join with a code: "+fmtCode(sync.cid)}).catch(()=>{});
  else copyCode();
};
window.openDisconnectSheet=()=>{
  openSheet(`
    <div class="eyebrow">Disconnect</div><h3>Unplug this phone?</h3>
    <div class="sheetnote">The vault and everything in it stays safe in the cloud — this phone just stops syncing. Rejoin anytime with the code.</div>
    <div class="row2"><button class="cta ghostd" style="flex:1" onclick="closeSheet()">Stay connected</button>
    <button class="cta pink" style="flex:1; background:var(--withdrawal)" onclick="disconnectVault()">Disconnect</button></div>`);
};
window.disconnectVault=()=>{
  closeSheet(); stopSync();
  sync=null; store.set('sync',null);
  toast('Disconnected — the vault is untouched');
  renderAll();
};
window.fbReady=()=>{ if(sync) startSync(); };

/* ---------- sheet & render ---------- */
function openSheet(html){ $('#sheet').innerHTML=html; $('#sheetwrap').classList.add('show'); }
window.closeSheet=()=>{ $('#sheetwrap').classList.remove('show'); };
$('#sheetwrap').addEventListener('click',e=>{ if(e.target.id==='sheetwrap') closeSheet(); });

function renderPage(){
  const inPlaces = ui.tab===1 && ui.planMode==='places';
  if(map && !inPlaces){ map.remove(); map=null; mapMarkers=[]; mapRing=null; }
  if(ui.tab!==1) clearInterval(cdTimer);
  const liveMap = (inPlaces && map) ? $('#mapbox') : null;
  $('#page').innerHTML=[homePage,planPage,calendarPage,settingsPage][ui.tab]();
  if(liveMap && $('#mapbox')) $('#mapbox').replaceWith(liveMap);
  if(ui.tab===1){ tickCountdown(); if(inPlaces && near.coords && !map) mountMap(); }
  if(ui.tab===3) wireSettings();
}
function renderAll(){ renderBanners(); renderPage(); renderTabbar(); }
function renderTabbar(){
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('on', +b.dataset.t===ui.tab));
}
document.querySelectorAll('.tabbar button').forEach(b=>b.onclick=()=>{ ui.tab=+b.dataset.t; ui.justSaved=false; renderAll(); window.scrollTo({top:0}); });

/* live second ticks: passbook cell + clock button */
setInterval(()=>{
  if(timer&&timer.running){
    const lv=$('#livev'); if(lv) lv.textContent=fmtMS(elapsedSecs());
    const tb=$('#tbtn-t'); if(tb) tb.textContent=fmtMS(elapsedSecs());
  }
},1000);

/* ---------- boot ---------- */
renderAll();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
<script type="module">
/* Firebase SDK loads here and hands its tools to the main script above */
import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js';
import { initializeFirestore, getFirestore, persistentLocalCache, doc, collection, setDoc, getDoc, deleteDoc, onSnapshot, writeBatch }
  from 'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';
window.fb={ initializeApp, getApps, getApp, initializeFirestore, getFirestore, persistentLocalCache,
  doc, collection, setDoc, getDoc, deleteDoc, onSnapshot, writeBatch };
if(window.fbReady) window.fbReady();
</script>
